[project]
name = "bacsy"
version = "0.1.0"
description = "Unofficial async Python client for the BCS Trade API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sergey Kostrukov" }]
keywords = ["bcs", "broker", "trading", "trade-api", "asyncio", "websocket"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
    "websockets>=14",
]

[project.scripts]
bacsy = "bacsy.cli:main"

[project.urls]
Homepage = "https://github.com/kostrse/bacsy-py"
Repository = "https://github.com/kostrse/bacsy-py"
Issues = "https://github.com/kostrse/bacsy-py/issues"
Changelog = "https://github.com/kostrse/bacsy-py/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bacsy"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[dependency-groups]
dev = [
    "basedpyright>=1.31",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "ruff>=0.14",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TC",     # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ASYNC",  # flake8-async
    "RUF",    # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["bacsy"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "bacsy.models.BaseApiModel",
  "bacsy.models.base.BaseApiModel",
  "bacsy.models.base.RequestModel",
  "bacsy.models.common.InstrumentRef",
  "bacsy.models.portfolio.BasePosition",
  "bacsy.models.portfolio.CashPosition",
  "bacsy.models.portfolio.InstrumentPosition",
  "bacsy.models.portfolio.SecurityPosition",
  "bacsy.models.instruments.BaseInstrument",
  "bacsy.models.instruments.Security",
  "bacsy.models.instruments.Derivative",
]

[tool.ruff.format]
docstring-code-format = true

[tool.basedpyright]
include = ["src", "tests", ".github/scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = true
reportImplicitOverride = true
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/bacsy"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
show_missing = true

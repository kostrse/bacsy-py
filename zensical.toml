# Zensical configuration for the English documentation site.
# zensical.toml and zensical.ru.toml are kept in step by hand: they differ only in
# docs_dir, site_dir, site_url, edit_uri, theme.language and the navigation titles.

[project]
site_name = "bacsy"
site_description = "Unofficial async Python client for the BCS Trade API"
site_url = "https://kostrse.github.io/bacsy-py/en/"
repo_url = "https://github.com/kostrse/bacsy-py"
repo_name = "kostrse/bacsy-py"
edit_uri = "edit/main/docs/en/"
docs_dir = "docs/en"
site_dir = "site/en"
watch = ["src/bacsy"]

nav = [
  { "Getting started" = [
    { "Introduction" = "index.md" },
    { "Features" = "getting-started/features.md" },
    { "Installation" = "getting-started/installation.md" },
    { "Quickstart" = "getting-started/quickstart.md" },
  ] },
  { "Guides" = [
    { "Accounts and tokens" = "guides/accounts-and-tokens.md" },
    { "Client setup" = "guides/client-setup.md" },
    { "Account data" = "guides/account-data.md" },
    { "Instruments" = "guides/instruments.md" },
    { "Market data" = "guides/market-data.md" },
    { "Orders" = "guides/orders.md" },
    { "Streaming" = "guides/streaming.md" },
    { "Errors and retries" = "guides/errors-and-retries.md" },
    { "Notebooks" = "guides/notebooks.md" },
    { "Long-running programs" = "guides/long-running-programs.md" },
  ] },
  { "Concepts" = [
    { "Authentication" = "concepts/authentication.md" },
    { "BCS API tokens" = "concepts/bcs-api-tokens.md" },
    { "Rate limiting" = "concepts/rate-limiting.md" },
    { "Models" = "concepts/models.md" },
    { "Streams" = "concepts/streams.md" },
    { "Architecture and testing" = "concepts/architecture-and-testing.md" },
    { "QUIK lineage" = "concepts/quik-lineage.md" },
  ] },
  { "Reference" = [
    { "Client" = "reference/client.md" },
    { "Configuration" = "reference/configuration.md" },
    { "Services" = "reference/services.md" },
    { "Streams" = "reference/streams.md" },
    { "Models" = "reference/models.md" },
    { "Exceptions" = "reference/exceptions.md" },
    { "Authentication" = "reference/authentication.md" },
    { "Accounts" = "reference/accounts.md" },
    { "Command line" = "reference/command-line.md" },
    { "Environment variables" = "reference/environment-variables.md" },
  ] },
]

[project.theme]
variant = "modern"
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.extra]
alternate = [
  { name = "English", link = "/bacsy-py/en/", lang = "en" },
  { name = "Русский", link = "/bacsy-py/ru/", lang = "ru" },
]

# The version selector reads ../versions.json, which .github/scripts/build_docs.py
# writes; MIKE_DOCS_VERSION in the environment names the version being built.
[project.extra.version]
provider = "mike"
default = "stable"
alias = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
extensions = [{ griffe_pydantic = { schema = false } }]
filters = ["!^_"]
heading_level = 2
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_root_heading = true
show_root_full_path = false
show_signature_annotations = true
show_source = false
signature_crossrefs = true

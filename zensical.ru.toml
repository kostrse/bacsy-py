# Zensical configuration for the Russian documentation site.
# zensical.toml and zensical.ru.toml are kept in step by hand: they differ only in
# docs_dir, site_dir, site_url, edit_uri, theme.language and the navigation titles.

[project]
site_name = "bacsy"
site_description = "Unofficial async Python client for the BCS Trade API"
site_url = "https://kostrse.github.io/bacsy-py/ru/"
repo_url = "https://github.com/kostrse/bacsy-py"
repo_name = "kostrse/bacsy-py"
edit_uri = "edit/main/docs/ru/"
docs_dir = "docs/ru"
site_dir = "site/ru"
watch = ["src/bacsy"]

nav = [
  { "Начало работы" = [
    { "Введение" = "index.md" },
    { "Возможности" = "getting-started/features.md" },
    { "Установка" = "getting-started/installation.md" },
    { "Быстрый старт" = "getting-started/quickstart.md" },
  ] },
  { "Руководства" = [
    { "Аккаунты и токены" = "guides/accounts-and-tokens.md" },
    { "Настройка клиента" = "guides/client-setup.md" },
    { "Данные счёта" = "guides/account-data.md" },
    { "Инструменты" = "guides/instruments.md" },
    { "Рыночные данные" = "guides/market-data.md" },
    { "Заявки" = "guides/orders.md" },
    { "Потоки" = "guides/streaming.md" },
    { "Ошибки и повторы" = "guides/errors-and-retries.md" },
    { "Блокноты" = "guides/notebooks.md" },
    { "Долгоживущие программы" = "guides/long-running-programs.md" },
  ] },
  { "Концепции" = [
    { "Аутентификация" = "concepts/authentication.md" },
    { "Токены BCS API" = "concepts/bcs-api-tokens.md" },
    { "Ограничение частоты" = "concepts/rate-limiting.md" },
    { "Модели" = "concepts/models.md" },
    { "Потоки" = "concepts/streams.md" },
    { "Архитектура и тестирование" = "concepts/architecture-and-testing.md" },
    { "Наследие QUIK" = "concepts/quik-lineage.md" },
  ] },
  { "Справочник" = [
    { "Клиент" = "reference/client.md" },
    { "Конфигурация" = "reference/configuration.md" },
    { "Сервисы" = "reference/services.md" },
    { "Потоки" = "reference/streams.md" },
    { "Модели" = "reference/models.md" },
    { "Исключения" = "reference/exceptions.md" },
    { "Аутентификация" = "reference/authentication.md" },
    { "Аккаунты" = "reference/accounts.md" },
    { "Командная строка" = "reference/command-line.md" },
    { "Переменные окружения" = "reference/environment-variables.md" },
  ] },
]

[project.theme]
variant = "modern"
language = "ru"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.extra]
alternate = [
  { name = "English", link = "/bacsy-py/en/", lang = "en" },
  { name = "Русский", link = "/bacsy-py/ru/", lang = "ru" },
]

# The version selector reads ../versions.json, which .github/scripts/build_docs.py
# writes; MIKE_DOCS_VERSION in the environment names the version being built.
[project.extra.version]
provider = "mike"
default = "stable"
alias = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
extensions = [{ griffe_pydantic = { schema = false } }]
filters = ["!^_"]
heading_level = 2
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_root_heading = true
show_root_full_path = false
show_signature_annotations = true
show_source = false
signature_crossrefs = true

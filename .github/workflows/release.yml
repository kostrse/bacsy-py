name: Release

# A pushed tag `vX.Y.Z` releases: the tag must match the project version, the checks must
# pass, the distributions go to PyPI through Trusted Publishing, and only then is the
# GitHub Release created with the notes taken from CHANGELOG.md. A manual dispatch is a
# dry run that publishes the current branch to TestPyPI and creates no release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Read the project version
        id: version
        run: |
          version="$(uv version --short)"
          if [[ "$version" =~ (a|b|rc|\.dev)[0-9]+ ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Project version: $version (pre-release: $prerelease)"

      - name: Verify the tag matches the project version
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          echo "pyproject.toml: $VERSION"
          echo "git tag:        $tag_version"
          if [ "$VERSION" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $VERSION in pyproject.toml"
            exit 1
          fi

      - name: Install dependencies
        run: uv sync

      - name: Run the check suite
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run basedpyright
          uv run pytest

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata
        run: uvx twine check --strict dist/*

      - name: Install the wheel in a clean environment
        run: uvx --from dist/*.whl bacsy --version

      - name: Install the sdist in a clean environment
        run: uvx --from dist/*.tar.gz bacsy --version

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/bacsy
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bacsy
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create the GitHub Release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python3 .github/scripts/release_notes.py "$VERSION" > "$RUNNER_TEMP/notes.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "bacsy $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${flags[@]}"

name: Documentation

# Builds the documentation site on every push and pull request, and publishes it to GitHub
# Pages on pushes to main and on release tags. The site is assembled from scratch each
# time by .github/scripts/build_docs.py: dev from the pushed tree, the newest release from
# its tag. Nothing is kept between runs, so there is no gh-pages branch.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group docs

      - name: Assemble the site
        run: uv run .github/scripts/build_docs.py

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/pages

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

name: Documentation

# Builds the documentation site on every push and pull request, and publishes it to GitHub
# Pages on pushes to main. The release workflow calls this one after publishing a final
# release. The site is assembled from scratch each time by .github/scripts/build_docs.py:
# dev from main, stable from the newest published release. Nothing is kept between runs,
# so there is no gh-pages branch.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Final release tag that passed the release workflow
        required: true
        type: string

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group docs

      - name: Check the examples
        run: uv run .github/scripts/check_docs_examples.py

      - name: Find the newest published release
        if: github.event_name != 'pull_request' && inputs.release_tag == ''
        id: published-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" \
            --exclude-drafts --exclude-pre-releases --limit 1 \
            --json tagName --jq '.[0].tagName // ""')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Assemble the pull request site
        if: github.event_name == 'pull_request'
        run: uv run .github/scripts/build_docs.py --no-release

      - name: Assemble the published site
        if: github.event_name != 'pull_request'
        env:
          RELEASE_TAG: ${{ inputs.release_tag || steps.published-release.outputs.tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            uv run .github/scripts/build_docs.py --release-tag "$RELEASE_TAG"
          else
            uv run .github/scripts/build_docs.py --no-release
          fi

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/pages

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
